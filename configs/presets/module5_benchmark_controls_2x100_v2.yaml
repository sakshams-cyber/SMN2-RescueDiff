project_name: SMN2-RescueDiff
module_name: Predicted Splicing-Rescue Scoring and Final SRSI Ranking

inputs:
  smn2_target_fasta: data/processed/target_definition/smn2_target_windows.fasta
  smn2_target_profile: data/processed/target_definition/smn2_target_profile.tsv
  smn2_target_metadata: data/processed/target_definition/smn2_target_metadata.json
  decoy_atlas_full: data/processed/decoy_atlas/hurda_180k_full_with_100_receptors.tsv
  decoy_atlas_summary: data/processed/decoy_atlas/hurda_summary.json
  generated_molecules_filtered: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/selected_molecules_for_docking.tsv
  generated_molecules_for_docking: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/selected_molecules_for_docking.tsv
  molecule_generation_summary: data/processed/benchmark_controls/risdiplam_branaplam_2x100/benchmark_control_generation_summary.json
  benchmark_controls:
    splicing_controls: data/raw/molecules/benchmark_controls/splicing_benchmark_controls.smi
  target_docking_scores: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/smn2_target_docking_scores.tsv
  decoy_docking_scores: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/decoy_docking_scores.tsv
  molecule_selectivity_scores: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/molecule_selectivity_scores.tsv
  candidates_for_splicing_rescue: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/candidates_for_splicing_rescue.tsv
  docking_summary: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/docking_summary.json
  pose_dir: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module4_2x100_v2/runs/benchmark_controls_risdiplam_branaplam_2x100_v2/poses

outputs:
  output_dir: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2
  table_dir: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2/tables
  evidence_dir: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2/evidence
  log_dir: data/processed/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2/logs
  figure_dir: figures/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2
  splicing_report_path: reports/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2_splicing_rescue_scoring.md
  final_report_path: reports/benchmark_controls/risdiplam_branaplam_2x100/module5_2x100_v2_final_report.md

run:
  random_seed: 42
  run_name: benchmark_controls_risdiplam_branaplam_2x100_v2
  overwrite_existing: false
  allow_dry_run_inputs: false
  require_real_docking_for_scientific_claims: true
  max_candidates_to_score: 2
  top_n_final_candidates: 2
  top_n_report_candidates: 2

splicing_landmarks:
  use_target_profile_landmarks: true
  infer_landmarks_from_window_names: true
  landmark_names:
    - exon_7
    - five_prime_splice_site
    - three_prime_splice_site
    - u1_snRNA_recognition_region
    - exon_intronic_boundary
    - exonic_splicing_enhancer_like_region
    - exonic_splicing_silencer_like_region
  beneficial_landmarks:
    - five_prime_splice_site
    - u1_snRNA_recognition_region
    - exonic_splicing_enhancer_like_region
  caution_landmarks:
    - core_donor_dinucleotide
    - core_acceptor_dinucleotide
    - essential_branchpoint_like_region

pose_analysis:
  enabled: true
  pose_mode: auto
  allow_missing_pose_files: false
  contact_distance_angstrom: 4.5
  hydrogen_bond_distance_angstrom: 3.5
  stacking_distance_angstrom: 5.0
  proximity_score_decay_angstrom: 8.0

splicing_rescue_scoring:
  score_mode: hybrid_pose_and_feature
  normalize_scores: true
  weights:
    beneficial_landmark_proximity: 2.0
    u1_support_region_proximity: 2.0
    exon7_boundary_support: 1.5
    target_binding_strength: 1.5
    contact_density: 1.0
    hydrogen_bond_proxy: 0.8
    stacking_proxy: 0.7
    splice_site_occlusion_penalty: 2.0
    off_target_risk_penalty: 1.5
    missing_pose_penalty: 0.5
  thresholds:
    strong_target_binding_deltaG: -7.0
    minimum_selectivity_gap: 1.0
    maximum_off_target_risk_score: 0.40
    minimum_splicing_rescue_score_for_advancement: 0.60

srsi:
  enabled: true
  use_z_score_normalization: true
  weights:
    smn2_binding_strength: 1.0
    splicing_rescue_score: 2.0
    weighted_selectivity_gap: 1.5
    qed: 0.7
    lipinski_bonus: 0.4
    pre_docking_candidate_score: 0.5
    off_target_risk_penalty: 1.5
    sa_score_penalty: 0.5
    pains_penalty: 1.0
    splice_site_occlusion_penalty: 1.2
  # Held-out controls are reference baselines, not generated candidate tiers.
  candidate_tiers:
    high_priority_min_srsi_percentile: 101
    medium_priority_min_srsi_percentile: 101
    low_priority_min_srsi_percentile: 101

confidence:
  assign_confidence_level: true
  dry_run_confidence: very_low
  target_only_docking_confidence: low
  target_plus_decoy_docking_confidence: moderate
  target_plus_small_decoy_panel_confidence: moderate
  large_decoy_pose_ablation_confidence: high
  moderate_confidence_min_decoys_with_valid_scores: 100
  high_confidence_min_decoys_with_valid_scores: 500
  pose_based_scoring_confidence_bonus: true
  missing_pose_confidence_penalty: true

ablation_analysis:
  enabled: true
  compare_binding_only_vs_full_srsi: true
  compare_without_decoy_penalty: true
  compare_without_splicing_rescue_score: true
  compare_without_chemical_quality: true

figures:
  make_figures: true
  max_candidates_heatmap: 2
  max_candidates_waterfall: 2
